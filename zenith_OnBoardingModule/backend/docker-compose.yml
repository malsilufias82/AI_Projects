services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: zenith_api
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/zenith
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MONGODB_URL: mongodb://mongo:mongo@mongodb:27017
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - zenith_net
    volumes:
      - .:/app
      - ../pages.json:/pages.json:ro

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: zenith_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/zenith
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MONGODB_URL: mongodb://mongo:mongo@mongodb:27017
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - zenith_net

  db:
    image: postgres:15-alpine
    container_name: zenith_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zenith
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenith_net

  redis:
    image: redis:7-alpine
    container_name: zenith_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenith_net

  mongodb:
    image: mongo:7
    container_name: zenith_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: zenith
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    command: mongod --quiet --logpath /dev/null
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenith_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: zenith_frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: zenith_api
      BACKEND_PORT: 8100
    ports:
      - "8101:8101"
    networks:
      - zenith_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zenith_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - zenith_net
    profiles:
      - tools

  minio:
    image: minio/minio:latest
    container_name: zenith_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - zenith_net
    profiles:
      - tools

networks:
  zenith_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
